# FinUp API - Base configuration
spring.application.name=finup-api
server.port=8080

# Variáveis locais (DB_USER, DB_PASS, JWT_SECRET, SPRING_PROFILES_ACTIVE) lidas de um
# arquivo .env na pasta de execução, se existir. O .env está no .gitignore e não vai
# para a imagem Docker. Variáveis de ambiente reais têm precedência sobre ele.
spring.config.import=optional:file:.env[.properties]

# Profile (dev | prod): variável de ambiente SPRING_PROFILES_ACTIVE ou a chave de mesmo nome no .env
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
