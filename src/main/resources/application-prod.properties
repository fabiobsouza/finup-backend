# ============================================================
# FinUp API - PROD Profile
# All sensitive values MUST be provided via environment vars
# ============================================================

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://dbsrv01.corp:5432/dbmainprod
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=finup
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=finup
spring.flyway.default-schema=finup
spring.flyway.baseline-on-migrate=true

# --- JWT ---
finup.jwt.secret=${JWT_SECRET}
finup.jwt.expiration-ms=86400000

# --- CORS ---
finup.cors.allowed-origins=*

# --- Logging ---
logging.level.com.finup=INFO
logging.level.org.springframework.security=WARN

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
