# ============================================================
# FinUp API - DEV Profile
# ============================================================

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://dbsrv01.corp:5432/dbmaindev
spring.datasource.username=${DB_USER:finup_dev}
spring.datasource.password=${DB_PASS:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=finup
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=finup
spring.flyway.default-schema=finup
spring.flyway.baseline-on-migrate=true

# --- JWT ---
finup.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars-long!}
finup.jwt.expiration-ms=86400000

# --- CORS ---
finup.cors.allowed-origins=*

# --- Logging ---
logging.level.com.finup=DEBUG
logging.level.org.springframework.security=DEBUG

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
